# 보듬 동물병원 — 컨테이너 6개: web, 서비스 3개, MySQL, Redis
#
#   docker compose -f v2/docker/compose.yaml --env-file v2/_run/secrets.env up -d --build --wait
#   node v2/tests/scenario.mjs --base-url http://localhost:28080
#   docker compose -f v2/docker/compose.yaml --env-file v2/_run/secrets.env down        (데이터는 남는다)
#   docker compose -f v2/docker/compose.yaml --env-file v2/_run/secrets.env down -v     (데이터까지 지운다)
#
# 비밀번호는 --env-file 로 준다 (항목은 env.example 참고). 이미지와 Git 에는 넣지 않는다.
# depends_on 을 쓰지 않는다. 어떤 순서로 떠도 정상이 되어야 한다 (쿠버네티스에는 순서가 없다).
name: v2

# 세 서비스가 똑같이 받는 설정 (① 문서 3.3)
x-service: &service
  environment: &service-env
    SPRING_DATA_REDIS_HOST: redis
    SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD 가 필요합니다}
    REDIS_TLS: "false"
    DB_POOL_MAX: "5"                       # 서비스 3개 x 5 = 15 (MySQL 한도 151)
  mem_limit: 384m                          # 힙은 이 값의 50% (이미지의 MaxRAMPercentage)
  restart: unless-stopped                  # 프로세스가 죽으면 다시 띄운다
  stop_grace_period: 40s                   # 처리 중인 요청을 마칠 시간 (스프링은 최대 30초 기다린다)
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 30s

services:
  web:
    image: vet2-web:${VERSION:-1.0.0}
    build: { context: ../.., dockerfile: v2/docker/web.Dockerfile, args: { VERSION: "${VERSION:-1.0.0}" } }
    ports: ["${WEB_PORT:-28080}:8080"]     # 밖에서 들어오는 길은 이것 하나뿐이다
    # 멈춘 서비스의 이름을 찾을 때 오래 기다리지 않는다. 기본값이면 "없다"는 답에 4초가 걸린다 (문제 C-9)
    dns_opt: ["timeout:1", "attempts:1"]
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 6

  auth:
    <<: *service
    image: vet2-auth:${VERSION:-1.0.0}
    build: { context: ../../msa, dockerfile: ../v2/docker/service.Dockerfile, args: { SERVICE: auth, VERSION: "${VERSION:-1.0.0}" } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vet_auth?connectionTimeZone=LOCAL&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: vet_auth
      SPRING_DATASOURCE_PASSWORD: ${DB_AUTH_PASSWORD:?DB_AUTH_PASSWORD 가 필요합니다}

  clinic:
    <<: *service
    image: vet2-clinic:${VERSION:-1.0.0}
    build: { context: ../../msa, dockerfile: ../v2/docker/service.Dockerfile, args: { SERVICE: clinic, VERSION: "${VERSION:-1.0.0}" } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vet_clinic?connectionTimeZone=LOCAL&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: vet_clinic
      SPRING_DATASOURCE_PASSWORD: ${DB_CLINIC_PASSWORD:?DB_CLINIC_PASSWORD 가 필요합니다}

  reservation:
    <<: *service
    image: vet2-reservation:${VERSION:-1.0.0}
    build: { context: ../../msa, dockerfile: ../v2/docker/service.Dockerfile, args: { SERVICE: reservation, VERSION: "${VERSION:-1.0.0}" } }
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vet_reservation?connectionTimeZone=LOCAL&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: vet_reservation
      SPRING_DATASOURCE_PASSWORD: ${DB_RESERVATION_PASSWORD:?DB_RESERVATION_PASSWORD 가 필요합니다}

  mysql:
    image: vet2-db:${VERSION:-1.0.0}
    build: { context: ../.., dockerfile: v2/docker/db.Dockerfile }
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 가 필요합니다}
      # 초기화 스크립트가 이 값으로 서비스 계정 3개를 만든다
      DB_AUTH_PASSWORD: ${DB_AUTH_PASSWORD}
      DB_CLINIC_PASSWORD: ${DB_CLINIC_PASSWORD}
      DB_RESERVATION_PASSWORD: ${DB_RESERVATION_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql          # 컨테이너를 지워도 예약 데이터는 남는다
    mem_limit: 1g
    restart: unless-stopped
    healthcheck:
      # TCP 로, 서비스 계정으로 시드를 읽는다. 초기화 중의 임시 서버는 TCP 를 열지 않는다 (① 문서 W-2).
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$DB_CLINIC_PASSWORD\" mysql -h127.0.0.1 -uvet_clinic -e 'SELECT 1 FROM vet_clinic.vets LIMIT 1' > /dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 로그인 세션 저장소. 비밀번호는 환경 변수에서 읽는다 ($$ 는 compose 가 아니라 컨테이너 안에서 풀린다).
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # 공식 이미지는 명령이 redis-server 로 시작할 때만 redis 사용자로 바꿔 준다. sh 로 시작하므로 직접 정한다 (문제 C-5)
    user: redis
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 6

volumes:
  mysql-data:

# web 의 Apache httpd 설정. 공식 이미지의 기본 설정을 고치지 않고 필요한 것만 적은 파일로 통째로 바꾼다.
# 경로 분기는 ① 문서 3.2 의 표를 옮긴 것이다.

ServerRoot "/usr/local/apache2"
ServerName localhost
# root 가 아닌 사용자는 1024 아래 포트와 logs/ 폴더를 쓰지 못한다 (문제 C-5)
Listen 8080
PidFile /tmp/httpd.pid

LoadModule mpm_event_module  modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module      modules/mod_unixd.so
LoadModule mime_module       modules/mod_mime.so
LoadModule dir_module        modules/mod_dir.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module        modules/mod_env.so
LoadModule headers_module    modules/mod_headers.so
LoadModule rewrite_module    modules/mod_rewrite.so
LoadModule proxy_module      modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

TypesConfig conf/mime.types
# 로그는 파일이 아니라 컨테이너의 표준 출력으로 낸다
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %t \"%r\" %>s %b %Dus" vet
CustomLog /proc/self/fd/1 vet

# 화면 하단의 서버 표시가 읽는 헤더 (web/app/src/api.ts). 값은 컨테이너의 환경 변수에서 온다 (문제 C-2)
PassEnv HOSTNAME WEB_VERSION
Header always set X-Web-Node    "%{HOSTNAME}e"
Header always set X-Web-Version "%{WEB_VERSION}e"

# ── /api 를 세 서비스로 나눠 보낸다 ─────────────────────────────────
# 위에서부터 처음 맞는 줄을 쓴다. 좁은 경로를 먼저 적는다.
#   connectiontimeout=2  접속이 2초 안에 안 되면 포기한다. 기본값은 60초다 (문제 C-9)
#   retry=0              실패한 서비스도 요청마다 다시 시도한다. 기본값은 60초 동안 시도하지 않는 것이다
ProxyRequests Off
ProxyPass /api/auth/          http://auth:8080/api/auth/            connectiontimeout=2 retry=0
ProxyPass /api/status/auth    http://auth:8080/api/status/auth      connectiontimeout=2 retry=0

ProxyPass /api/admin/notices  http://clinic:8080/api/admin/notices  connectiontimeout=2 retry=0
ProxyPass /api/pets           http://clinic:8080/api/pets           connectiontimeout=2 retry=0
ProxyPass /api/notices        http://clinic:8080/api/notices        connectiontimeout=2 retry=0
ProxyPass /api/slots          http://clinic:8080/api/slots          connectiontimeout=2 retry=0
ProxyPass /api/status/clinic  http://clinic:8080/api/status/clinic  connectiontimeout=2 retry=0

# 나머지 /api 는 reservation (예약, 간호사, 원장)
ProxyPass /api/               http://reservation:8080/api/          connectiontimeout=2 retry=0

# ── 화면 (정적 파일) ────────────────────────────────────────────────
DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

<Directory />
    AllowOverride None
    Require all denied
</Directory>

<Directory "/usr/local/apache2/htdocs">
    Require all granted
    # 폴더 목록은 보여 주지 않는다 (Indexes 를 뺐다, 문제 C-3). FollowSymLinks 는 아래 RewriteRule 에 필요하다.
    Options FollowSymLinks
    # 소개 페이지: /about → about.html
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME}.html -f
    RewriteRule ^(.+)$ $1.html [L]
</Directory>

<Directory "/usr/local/apache2/htdocs/app">
    # 예약 화면(SPA): 파일이 없으면 index.html 을 준다
    FallbackResource /app/index.html
</Directory>

# /health 는 "ok" 두 글자짜리 파일이다 (Dockerfile 이 만든다)
<Files "health">
    ForceType text/plain
</Files>

# v0 — 가장 단순한 형태. 경로 분기는 ① 문서 3.2 의 표를 옮겼다.
# ProxyPass 는 위에서부터 처음 맞는 줄을 쓴다. 좁은 경로를 먼저 적는다.
ProxyPass /api/auth/          http://auth:8080/api/auth/
ProxyPass /api/status/auth    http://auth:8080/api/status/auth

ProxyPass /api/admin/notices  http://clinic:8080/api/admin/notices
ProxyPass /api/pets           http://clinic:8080/api/pets
ProxyPass /api/notices        http://clinic:8080/api/notices
ProxyPass /api/slots          http://clinic:8080/api/slots
ProxyPass /api/status/clinic  http://clinic:8080/api/status/clinic

ProxyPass /api/               http://reservation:8080/api/

<Directory "/usr/local/apache2/htdocs">
    # /about → about.html
    RewriteEngine On
    RewriteCond %{REQUEST_FILENAME}.html -f
    RewriteRule ^(.+)$ $1.html [L]
</Directory>
<Directory "/usr/local/apache2/htdocs/app">
    # 예약 화면(SPA): 파일이 없으면 index.html 을 준다
    FallbackResource /app/index.html
</Directory>

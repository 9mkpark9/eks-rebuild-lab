# db-init: 빈 RDS 에 스키마 4개, 시드, 서비스 계정 3개를 넣는다. 클러스터 안 MySQL 은 처음 뜰 때 스스로 했던 일이다.
# 같은 db 이미지의 같은 스크립트(v2/docker/db/10-init.sh)를 DB 서버 없이 클라이언트로만 돌린다.
#
# - 관리자 계정은 Secret vet-rds-admin (v2/k8s/rds-secret.sh -n vet2-rds 가 Secrets Manager 에서 옮긴다)
# - 서비스 계정 비밀번호는 Secret vet-db (v2/k8s/secrets.sh)
# - 이미 끝난 DB 면 아무것도 하지 않고 성공한다. 그래서 다시 적용해도 안전하다.
#   끝난 Job 은 1시간 뒤 지워진다. Job 의 내용은 바꿀 수 없어서, 남아 있으면 이미지를 바꿔 다시 적용할 때 거부된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  labels: { app: db-init }
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: db-init }
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: db-init
          image: vet2-db
          command: ["bash", "/docker-entrypoint-initdb.d/10-init.sh"]
          env:
            - name: DB_ADMIN_HOST
              valueFrom: { configMapKeyRef: { name: vet-config, key: DB_HOST } }
            - name: DB_ADMIN_USER
              valueFrom: { secretKeyRef: { name: vet-rds-admin, key: username } }
            - name: DB_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: vet-rds-admin, key: password } }
            - name: DB_AUTH_PASSWORD
              valueFrom: { secretKeyRef: { name: vet-db, key: auth-password } }
            - name: DB_CLINIC_PASSWORD
              valueFrom: { secretKeyRef: { name: vet-db, key: clinic-password } }
            - name: DB_RESERVATION_PASSWORD
              valueFrom: { secretKeyRef: { name: vet-db, key: reservation-password } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }

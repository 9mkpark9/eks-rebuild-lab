# kubeadm 클러스터에 한 번 준비하는 것: MySQL 데이터를 둘 볼륨.
# kubeadm 에는 볼륨을 자동으로 만들어 주는 장치(provisioner)가 없다. 그래서 워커 한 대의 디스크 폴더를 볼륨으로 직접 등록한다.
# 이 볼륨은 vet2-w1 에만 있다. MySQL Pod 는 항상 vet2-w1 에 뜨고, vet2-w1 이 죽으면 다른 노드로 옮겨 가지 못한다.
# 먼저 vet2-w1 에서: mkdir -p /var/lib/vet2-mysql
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: vet2-local }
provisioner: kubernetes.io/no-provisioner   # 자동으로 만들지 않는다. 아래 PV 를 직접 등록해 쓴다
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: vet2-mysql }
spec:
  capacity: { storage: 2Gi }
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain       # PVC 를 지워도 노드의 데이터는 지우지 않는다
  storageClassName: vet2-local
  local: { path: /var/lib/vet2-mysql }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [vet2-w1] }

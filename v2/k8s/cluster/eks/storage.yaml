# EKS Auto Mode 에 한 번 준비하는 것: EBS 볼륨을 만들어 주는 StorageClass.
# 클러스터에 처음부터 있는 gp2 는 옛 방식(kubernetes.io/aws-ebs)이라 ebs.csi.aws.com 드라이버를 찾는데,
# Auto Mode 에 들어 있는 드라이버의 이름은 ebs.csi.eks.amazonaws.com 이다. gp2 로는 볼륨이 영영 만들어지지 않는다 (④ 문제).
#   kubectl apply -f v2/k8s/cluster/eks/storage.yaml
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vet2-ebs
provisioner: ebs.csi.eks.amazonaws.com
# Pod 가 놓일 노드(가용 영역)가 정해진 뒤에 그 영역에 볼륨을 만든다. EBS 는 한 영역 안에서만 붙는다.
volumeBindingMode: WaitForFirstConsumer
# PVC 를 지우면 EBS 도 지운다. 남겨 두면 요금이 계속 나간다.
reclaimPolicy: Delete
parameters:
  type: gp3
  encrypted: "true"

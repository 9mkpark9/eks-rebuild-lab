# v0 — 가장 단순한 형태. compose.yaml 의 컨테이너 6개를 그대로 Deployment 와 Service 로 옮겼다.
# ${...} 자리에는 적용할 때 비밀번호가 들어간다 (값을 채운 파일은 Git 에 올라가지 않는 폴더에 만든다):
#   set -a; . v2/_run/secrets.env; set +a
#   envsubst < v2/k8s/v0/all.yaml > v2/_run/3-k8s/v0-rendered.yaml
#   kubectl apply -f v2/_run/3-k8s/v0-rendered.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: vet2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: vet2
spec:
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: vet2-db:1.0.0
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: "${DB_ROOT_PASSWORD}" }
            - { name: DB_AUTH_PASSWORD, value: "${DB_AUTH_PASSWORD}" }
            - { name: DB_CLINIC_PASSWORD, value: "${DB_CLINIC_PASSWORD}" }
            - {
                name: DB_RESERVATION_PASSWORD,
                value: "${DB_RESERVATION_PASSWORD}",
              }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: vet2
spec:
  selector: { app: mysql }
  ports: [{ port: 3306 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: vet2
spec:
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--requirepass", "${REDIS_PASSWORD}"]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: vet2
spec:
  selector: { app: redis }
  ports: [{ port: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: auth, namespace: vet2 }
spec:
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: auth
          image: vet2-auth:1.0.0
          env:
            - {
                name: SPRING_DATASOURCE_URL,
                value: "jdbc:mysql://mysql:3306/vet_auth?connectionTimeZone=LOCAL&characterEncoding=UTF-8",
              }
            - { name: SPRING_DATASOURCE_USERNAME, value: vet_auth }
            - { name: SPRING_DATASOURCE_PASSWORD, value: "${DB_AUTH_PASSWORD}" }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PASSWORD, value: "${REDIS_PASSWORD}" }
            - { name: REDIS_TLS, value: "false" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth
  namespace: vet2
spec:
  selector: { app: auth }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic
  namespace: vet2
spec:
  selector: { matchLabels: { app: clinic } }
  template:
    metadata: { labels: { app: clinic } }
    spec:
      containers:
        - name: clinic
          image: vet2-clinic:1.0.0
          env:
            - {
                name: SPRING_DATASOURCE_URL,
                value: "jdbc:mysql://mysql:3306/vet_clinic?connectionTimeZone=LOCAL&characterEncoding=UTF-8",
              }
            - { name: SPRING_DATASOURCE_USERNAME, value: vet_clinic }
            - {
                name: SPRING_DATASOURCE_PASSWORD,
                value: "${DB_CLINIC_PASSWORD}",
              }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PASSWORD, value: "${REDIS_PASSWORD}" }
            - { name: REDIS_TLS, value: "false" }
---
apiVersion: v1
kind: Service
metadata:
  name: clinic
  namespace: vet2
spec:
  selector: { app: clinic }
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation
  namespace: vet2
spec:
  selector: { matchLabels: { app: reservation } }
  template:
    metadata: { labels: { app: reservation } }
    spec:
      containers:
        - name: reservation
          image: vet2-reservation:1.0.0
          env:
            - {
                name: SPRING_DATASOURCE_URL,
                value: "jdbc:mysql://mysql:3306/vet_reservation?connectionTimeZone=LOCAL&characterEncoding=UTF-8",
              }
            - { name: SPRING_DATASOURCE_USERNAME, value: vet_reservation }
            - {
                name: SPRING_DATASOURCE_PASSWORD,
                value: "${DB_RESERVATION_PASSWORD}",
              }
            - { name: SPRING_DATA_REDIS_HOST, value: redis }
            - { name: SPRING_DATA_REDIS_PASSWORD, value: "${REDIS_PASSWORD}" }
            - { name: REDIS_TLS, value: "false" }
---
apiVersion: v1
kind: Service
metadata:
  name: reservation
  namespace: vet2
spec:
  selector:
    app: reservation
  ports: [{ port: 8080 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vet2
spec:
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: web
          image: vet2-web:1.0.0
---
# 이 PC 의 클러스터(Docker Desktop)는 LoadBalancer 를 localhost 로 열어 준다
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vet2
spec:
  type: LoadBalancer
  selector: { app: web }
  ports: [{ port: 28080, targetPort: 8080 }]

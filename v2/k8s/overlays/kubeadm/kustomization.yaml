# kubeadm: EC2 3대(컨트롤 플레인 1, 워커 2)에 kubeadm 으로 만든 클러스터.
# 이미지는 ECR 에서 받는다. ECR 주소에는 AWS 계정 번호가 들어 있어 여기에는 ECR_REGISTRY 라고만 적고,
# 적용할 때 v2/k8s/apply.sh 가 실제 주소로 바꿔 넣는다.
#   v2/k8s/apply.sh kubeadm
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vet2
resources:
  - namespace.yaml
  - ../../base
  - ../../mysql          # 필수 과제: DB 는 클러스터 안 (StatefulSet + 볼륨)
patches:
  # 로드밸런서를 만들어 주는 장치가 없으므로 노드의 포트를 직접 연다: http://<노드의 공인 IP>:30080
  - target:
      kind: Service
      name: web
    patch: |-
      - { op: replace, path: /spec/type, value: NodePort }
      - { op: add, path: /spec/ports/0/nodePort, value: 30080 }
  # MySQL 볼륨은 v2/k8s/cluster/kubeadm/storage.yaml 이 등록한 노드 디스크에서 받는다
  - target: { kind: StatefulSet, name: mysql }
    patch: |-
      - { op: add, path: /spec/volumeClaimTemplates/0/spec/storageClassName, value: vet2-local }
images:
  - { name: vet2-web, newName: ECR_REGISTRY/vet2-web, newTag: 1.0.0 }
  - { name: vet2-auth, newName: ECR_REGISTRY/vet2-auth, newTag: 1.0.0 }
  - { name: vet2-clinic, newName: ECR_REGISTRY/vet2-clinic, newTag: 1.0.0 }
  - {
      name: vet2-reservation,
      newName: ECR_REGISTRY/vet2-reservation,
      newTag: 1.0.0,
    }
  - { name: vet2-db, newName: ECR_REGISTRY/vet2-db, newTag: 1.1.0 }

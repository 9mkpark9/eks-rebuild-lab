AWSTemplateFormatVersion: "2010-09-09"
# 스택 4: EKS Auto Mode 클러스터와 IAM 역할 2개.
# 노드, EBS 드라이버, 로드밸런서 기능은 Auto Mode 에 들어 있다 (④ 2장).
# 클러스터 안의 것(StorageClass, IngressClass, 앱)은 v2/k8s/ 의 파일로 kubectl 이 넣는다.
#   v2/infra/stacks.sh up eks          (10분 안팎 걸린다)
Description: vet2 EKS Auto Mode cluster and IAM roles

Parameters:
  MyCidr:
    Type: String
    Description: 클러스터 API 에 접속할 수 있는 주소. 예) 203.0.113.10/32
    AllowedPattern: '^\d+\.\d+\.\d+\.\d+/\d+$'
  KubernetesVersion:
    Type: String
    Default: "1.36"

Resources:
  # Auto Mode 의 클러스터 역할: 노드·볼륨·로드밸런서·네트워크를 EKS 가 대신 다루는 권한
  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vet2-eks-cluster
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          [
            {
              Effect: Allow,
              Principal: { Service: eks.amazonaws.com },
              Action: [sts:AssumeRole, sts:TagSession],
            },
          ]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy
        - arn:aws:iam::aws:policy/AmazonEKSComputePolicy
        - arn:aws:iam::aws:policy/AmazonEKSBlockStoragePolicy
        - arn:aws:iam::aws:policy/AmazonEKSLoadBalancingPolicy
        - arn:aws:iam::aws:policy/AmazonEKSNetworkingPolicy

  # Auto Mode 가 만드는 노드의 역할. ECR 을 이 역할로 읽는다 (④ 4.2: Secret 이 필요 없다)
  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: vet2-eks-node
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          [
            {
              Effect: Allow,
              Principal: { Service: ec2.amazonaws.com },
              Action: sts:AssumeRole,
            },
          ]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodeMinimalPolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryPullOnly

  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: vet2-eks
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds: [!ImportValue vet2-SubnetA, !ImportValue vet2-SubnetC]
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
        PublicAccessCidrs: [!Ref MyCidr] # API 는 이 주소에서만
      AccessConfig:
        AuthenticationMode: API
        BootstrapClusterCreatorAdminPermissions: true # 스택을 만든 사람에게 관리자 권한
      # Auto Mode
      BootstrapSelfManagedAddons: false
      ComputeConfig:
        Enabled: true
        NodePools: [general-purpose, system]
        NodeRoleArn: !GetAtt NodeRole.Arn
      KubernetesNetworkConfig:
        ElasticLoadBalancing: { Enabled: true }
      StorageConfig:
        BlockStorage: { Enabled: true }

Outputs:
  ClusterName: { Value: !Ref Cluster }
  # Auto Mode 노드는 이 클러스터 보안 그룹을 쓴다. RDS 스택이 이 그룹에서 오는 3306 만 받는다.
  ClusterSgId: { Value: !GetAtt Cluster.ClusterSecurityGroupId, Export: { Name: vet2-EksClusterSg } }

# WEB 계층 nginx 설정 (부록 E.3)
# Amazon Linux 2023 기본 설정의 80번 기본 서버와 겹치지 않도록 nginx.conf 전체를 이 파일로 바꾼다.
# __INTERNAL_ALB_DNS__ 는 WEB 사용자 데이터가 sed 로 채운다 (부록 E.2).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                    '$request_time "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    server_tokens off;
    keepalive_timeout 75s;                      # ALB 유휴 제한 시간(60초)보다 길게

    server {
        listen 80 default_server;
        add_header X-Web-Node $hostname always; # 분산 확인용 (호스트 이름 = 인스턴스 ID)
        resolver 169.254.169.253 valid=10s;     # Amazon DNS. 내부 ALB의 IP가 바뀌어도 따라간다
        set $was_alb "http://__INTERNAL_ALB_DNS__:8080";

        location = /health { access_log off; return 200 'ok'; }

        location /api/ {
            proxy_pass $was_alb;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /app/ {                        # 예약·관리자 화면 (React SPA) ← web/dist/app
            root /usr/share/nginx/vet;
            try_files $uri /app/index.html;
        }

        location / {                            # 병원 소개·진료 안내 (정적 HTML) ← web/dist/site
            root /usr/share/nginx/vet/site;
            try_files $uri $uri.html $uri/ =404;
        }
    }
}

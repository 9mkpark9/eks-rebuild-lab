# WEB 컨테이너용 Apache httpd 설정 (기본 웹 서버)
# deploy/nginx.conf(AWS 3-Tier)와 같은 일을 하되, /api 를 서비스 3개로 나눠 보낸다.
# nginx 판(msa/web/nginx/default.conf.template)과 겉으로 보이는 동작이 같아야 한다:
#   8080 포트, /health, X-Web-Node, 서비스 주소 환경 변수 3개, 죽은 서비스에 대한 503 JSON.
#
# ${...} 는 httpd 가 시작할 때 환경 변수에서 읽는다:
#   AUTH_UPSTREAM / CLINIC_UPSTREAM / RESERVATION_UPSTREAM   예) auth:8080, auth.dev.svc.cluster.local:8080
#   HOSTNAME (컨테이너·Pod 이름), WEB_VERSION (이미지 태그)

ServerRoot "/usr/local/apache2"
Listen 8080
ServerName localhost
ServerTokens Prod
ServerSignature Off
# root 가 아닌 사용자로 뜨므로 쓸 수 있는 곳은 /tmp 뿐이다
PidFile /tmp/httpd.pid

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule mime_module modules/mod_mime.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule asis_module modules/mod_asis.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

# 작은 컨테이너에 맞춘 값. 정적 파일과 프록시뿐이라 스레드가 메모리를 거의 쓰지 않는다.
StartServers          1
ServerLimit           2
ThreadsPerChild      64
MaxRequestWorkers   128
MinSpareThreads      16
MaxSpareThreads      64

Timeout 60
KeepAlive On
MaxKeepAliveRequests 1000
# 앞단 로드밸런서의 유휴 제한(60초)보다 길게 둔다. 짧으면 LB 가 닫힌 연결로 요청을 보내 502 가 난다.
KeepAliveTimeout 75

TypesConfig conf/mime.types
DirectoryIndex index.html

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a [%t] \"%r\" %>s %B %D \"%{X-Forwarded-For}i\"" vet
CustomLog /proc/self/fd/1 vet env=!dontlog

# 분산 확인용: 어느 web 이 응답했는지와 그 버전
Header always set X-Web-Node "${HOSTNAME}"
Header always set X-Web-Version "${WEB_VERSION}"

<Directory />
    AllowOverride None
    Require all denied
</Directory>

# ── 헬스 체크 ─────────────────────────────────────────────────────────
Alias "/health" "/usr/local/apache2/vet/health.txt"
<Location "/health">
    Require all granted
    ForceType text/plain
    SetEnv dontlog 1
</Location>

# ── /api → 서비스 3개 ─────────────────────────────────────────────────
# ProxyPass 는 위에서부터 처음 맞는 줄을 쓴다. /api/admin/notices 가 /api/admin/ 보다 먼저 와야 한다.
#   disablereuse=On  요청마다 이름을 다시 찾는다. 서비스가 다시 떠 IP 가 바뀌어도 재시작 없이 따라간다.
#   retry=0          연결에 실패한 뒤 쉬는 시간(기본 60초)을 없앤다. 서비스가 돌아오면 바로 다시 붙는다.
ProxyRequests Off
ProxyPreserveHost On
ProxyVia Off

# 상태 쪽지(/status)가 읽는 경로. 서비스마다 하나씩이라, 한 서비스가 멈추면 그 줄만 응답이 없다.
# 화면이 5초마다 부르므로 오래 기다리지 않는다.
ProxyPass "/api/status/auth"        "http://${AUTH_UPSTREAM}/api/status/auth"               connectiontimeout=2 timeout=5 disablereuse=On retry=0
ProxyPass "/api/status/clinic"      "http://${CLINIC_UPSTREAM}/api/status/clinic"           connectiontimeout=2 timeout=5 disablereuse=On retry=0
ProxyPass "/api/status/reservation" "http://${RESERVATION_UPSTREAM}/api/status/reservation" connectiontimeout=2 timeout=5 disablereuse=On retry=0

ProxyPass "/api/auth/"         "http://${AUTH_UPSTREAM}/api/auth/"                 connectiontimeout=5 timeout=30 disablereuse=On retry=0

ProxyPass "/api/admin/notices" "http://${CLINIC_UPSTREAM}/api/admin/notices"       connectiontimeout=5 timeout=30 disablereuse=On retry=0
ProxyPass "/api/pets"          "http://${CLINIC_UPSTREAM}/api/pets"                connectiontimeout=5 timeout=30 disablereuse=On retry=0
ProxyPass "/api/notices"       "http://${CLINIC_UPSTREAM}/api/notices"             connectiontimeout=5 timeout=30 disablereuse=On retry=0
ProxyPass "/api/slots"         "http://${CLINIC_UPSTREAM}/api/slots"               connectiontimeout=5 timeout=30 disablereuse=On retry=0

ProxyPass "/api/reservations"  "http://${RESERVATION_UPSTREAM}/api/reservations"   connectiontimeout=5 timeout=30 disablereuse=On retry=0
ProxyPass "/api/admin/"        "http://${RESERVATION_UPSTREAM}/api/admin/"         connectiontimeout=5 timeout=30 disablereuse=On retry=0
ProxyPass "/api/director/"     "http://${RESERVATION_UPSTREAM}/api/director/"      connectiontimeout=5 timeout=30 disablereuse=On retry=0

# 서비스가 죽어 Apache 가 직접 만드는 오류만 { code, message } JSON 으로 바꾼다.
# 서비스가 스스로 돌려준 오류(401, 409, 503 DB_UNAVAILABLE …)는 그대로 통과한다 (ProxyErrorOverride 기본값 Off).
# 이름을 못 찾으면 500(httpd 2.4.71 에서 확인), 연결이 거절되면 503, 응답이 끊기거나 없으면 502·504 가 난다.
# 화면과 스크립트가 한 가지로 다루도록 모두 503 으로 맞춘다. /api/ 아래에서 Apache 가 직접 만드는 500 은 프록시 실패뿐이다.
<Location "/api/">
    ErrorDocument 500 /errors/unavailable.asis
    ErrorDocument 502 /errors/unavailable.asis
    ErrorDocument 503 /errors/unavailable.asis
    ErrorDocument 504 /errors/unavailable.asis
    ErrorDocument 404 /errors/not-found.json
</Location>

Alias "/errors/" "/usr/local/apache2/vet/errors/"
<Directory "/usr/local/apache2/vet/errors">
    Require all granted
    # .asis 파일은 안에 적힌 상태 코드와 헤더를 그대로 보낸다 (502·504 를 503 으로 바꾸는 장치)
    AddHandler send-as-is asis
</Directory>

# ── 예약·관리자 화면 (React SPA) ← web/dist/app ───────────────────────
Alias "/app" "/usr/local/apache2/vet/app"
<Directory "/usr/local/apache2/vet/app">
    Options None
    Require all granted
    # 화면 경로(/app/reserve 등)는 파일이 없으므로 index.html 을 준다 (nginx 의 try_files $uri /app/index.html)
    FallbackResource /app/index.html
</Directory>

# ── 병원 소개·진료 안내 (정적 HTML) ← web/dist/site ───────────────────
DocumentRoot "/usr/local/apache2/vet/site"
<Directory "/usr/local/apache2/vet/site">
    Options None
    Require all granted
</Directory>

# /about → about.html (nginx 의 try_files $uri $uri.html)
RewriteEngine On
RewriteCond %{REQUEST_URI} !^/(api|app|errors|health)(/|$)
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI} !-f
RewriteCond %{DOCUMENT_ROOT}%{REQUEST_URI}.html -f
RewriteRule ^(.+)$ $1.html [PT,L]

# Secret 예시 — 이름과 키만 보여 주는 파일이다. 값이 없고, 어느 kustomization 에도 들어 있지 않다.
# 실제 Secret 은 Git 에 넣지 않는다. 클러스터마다 scripts\new-k8s-secrets.ps1 로 만든다.
# 값을 채운 사본을 커밋하지 않는다.
#
# 배포 파일이 참조하는 곳
#   vet-db            서비스 3개(자기 계정의 비밀번호), MySQL Pod, 초기화 Job
#   vet-redis         서비스 3개, redis
#   vet-db-external   바깥 DB 를 쓸 때만: 서비스 3개(host), 초기화 Job
apiVersion: v1
kind: Secret
metadata:
  name: vet-db
type: Opaque
stringData:
  root-password: ""          # MySQL Pod 의 root. 바깥 DB 를 쓰면 쓰이지 않는다
  auth-password: ""          # vet_auth 계정
  clinic-password: ""        # vet_clinic 계정
  reservation-password: ""   # vet_reservation 계정
---
apiVersion: v1
kind: Secret
metadata:
  name: vet-redis
type: Opaque
stringData:
  password: ""
---
# 바깥 DB(RDS)를 쓰는 환경에만 필요하다 (components/db-external)
apiVersion: v1
kind: Secret
metadata:
  name: vet-db-external
type: Opaque
stringData:
  host: ""             # 예: RDS 엔드포인트. 주소도 Git 에 넣지 않는다
  admin-user: ""       # 스키마와 계정을 만들 수 있는 관리자 계정
  admin-password: ""

# 복제본을 노드와 가용 영역에 나눈다.
#  - 노드: 한 노드에 몰리지 않게 강제한다 (차이가 1을 넘으면 배치하지 않는다).
#          복제본 2개는 서로 다른 노드에 놓이고, 배포 중 잠깐 3개가 되어도 노드가 2대면 놓을 수 있다.
#  - 가용 영역: 되도록 나눈다. 영역이 하나뿐인 클러스터에서도 배치가 막히지 않게 강제하지는 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: web
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web

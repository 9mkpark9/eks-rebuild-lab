# eks: Amazon EKS(Auto Mode)용 (과제 ④). kubeadm 과 다른 점은 이 폴더에 있는 것이 전부다.
#   - 밖으로 여는 법: Ingress → ALB (kubeadm 은 NodePort)
#   - DB 의 볼륨: EBS, StorageClass vet-ebs (kubeadm 은 노드의 디스크)
#   - 이미지: ECR 에서 받는다 (kubeadm 은 ghcr.io)
#   - web 의 종료 대기: 5초 → 15초. ALB 가 내려가는 Pod 를 대상에서 빼는 데 시간이 더 걸린다.
#   - mysql, redis: Auto Mode 가 노드를 정리할 때 옮기지 않게 표시한다 (kubeadm 에는 그런 장치가 없다)
#
# 먼저 준비:  gitops/cluster/eks/ (StorageClass, IngressClass),  scripts/new-k8s-secrets.sh -n vet (Secret)
# ECR 주소에는 AWS 계정 번호가 들어 있어 Git 에 적지 않는다. 아래 images 의 ECR_REGISTRY 는 자리 표시이고,
# 적용할 때 scripts/eks-apply.sh 가 실제 주소로 바꿔 넣는다.
#   scripts/eks-apply.sh             # 적용
#   scripts/eks-apply.sh --render    # 무엇이 적용되는지 보기 (계정 번호는 가려서 출력)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vet

resources:
  - namespace.yaml
  - ../../base
  - ingress.yaml

# DB 를 고르는 한 줄이다.
#   ../../components/db-in-cluster   클러스터 안의 MySQL Pod + EBS 볼륨 (필수 과제)
#   ../../components/db-external     바깥 DB, RDS (선택 과제). Secret vet-db-external 이 필요하고, 아래 mysql-storage.yaml 줄을 지운다.
components:
  - ../../components/db-in-cluster
  # 지표 서버(metrics-server)를 설치했다면 아래 줄을 살려 reservation 을 자동으로 늘린다 (선택 과제)
  # - ../../components/autoscale

patches:
  - path: mysql-storage.yaml
  - path: web-prestop.yaml
  # Pod 가 하나뿐인 mysql 과 redis 에 적용한다 (mysql 이 없으면 redis 에만 적용된다)
  - path: no-disrupt.yaml
    target:
      kind: StatefulSet|Deployment
      name: mysql|redis

images:
  - name: vet-web
    newName: ECR_REGISTRY/vet-web
    newTag: 1.0.0-apache
  - name: vet-auth
    newName: ECR_REGISTRY/vet-auth
    newTag: 1.0.0
  - name: vet-clinic
    newName: ECR_REGISTRY/vet-clinic
    newTag: 1.0.0
  - name: vet-reservation
    newName: ECR_REGISTRY/vet-reservation
    newTag: 1.0.0
  - name: vet-db
    newName: ECR_REGISTRY/vet-db
    newTag: 1.0.0
  # redis 는 공식 이미지를 그대로 쓴다. Docker Hub 의 익명 내려받기 제한을 피하려고 ECR Public 의 같은 이미지를 받는다.
  - name: redis
    newName: public.ecr.aws/docker/library/redis

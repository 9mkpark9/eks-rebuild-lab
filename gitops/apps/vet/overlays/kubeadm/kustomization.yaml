# kubeadm: EC2 에 직접 만든 클러스터용 (과제 ③)
#   - 밖으로 여는 법: NodePort 30080. 로드밸런서를 만들어 주는 장치가 없으므로 노드의 포트를 직접 연다.
#   - DB: 클러스터 안의 MySQL Pod. 데이터는 노드 한 대의 디스크(StorageClass vet-local)에 둔다.
#   - 이미지: 레지스트리에 올린 것을 받는다.
#
# 먼저 준비:  gitops/cluster/kubeadm/ (볼륨),  scripts/new-k8s-secrets.sh -n vet (Secret)
#   kubectl kustomize gitops/apps/vet/overlays/kubeadm     # 무엇이 적용되는지 보기
#   kubectl apply -k gitops/apps/vet/overlays/kubeadm
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vet

resources:
  - namespace.yaml
  - ../../base

# DB 를 고르는 한 줄이다. 바깥 DB 를 쓰려면 ../../components/db-external 로 바꾸고 아래 mysql-storage.yaml 줄을 지운다.
components:
  - ../../components/db-in-cluster

patches:
  - path: web-nodeport.yaml
  - path: mysql-storage.yaml

# 이미지를 받을 곳과 버전. 이 한 곳에서만 정한다.
# web 의 태그 끝(-apache / -nginx)으로 웹 서버를 고른다.
images:
  - name: vet-web
    newName: ghcr.io/9mkpark9/vet-web
    newTag: 1.0.0-apache
  - name: vet-auth
    newName: ghcr.io/9mkpark9/vet-auth
    newTag: 1.0.0
  - name: vet-clinic
    newName: ghcr.io/9mkpark9/vet-clinic
    newTag: 1.0.0
  - name: vet-reservation
    newName: ghcr.io/9mkpark9/vet-reservation
    newTag: 1.0.0
  - name: vet-db
    newName: ghcr.io/9mkpark9/vet-db
    newTag: 1.0.0

# mysql: 클러스터 안에서 도는 예약 DB (dev 용)
# 디스크(PVC)를 붙이지 않는다. Pod 가 다시 뜨면 스키마, 그날 기준 시드, 서비스별 스키마·계정·뷰를 새로 만든다.
#  - 얻는 것: EBS 드라이버가 필요 없고, 어느 노드·어느 가용 영역으로든 옮겨 갈 수 있다. 다시 만들면 늘 같은 초기 상태다.
#  - 잃는 것: Pod 가 다시 뜨면 그동안의 예약이 사라진다. 데이터를 지켜야 하는 prod 는 바깥 DB 를 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  # DB 는 둘이 동시에 뜨면 안 된다
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # 공식 이미지의 mysql 사용자. 처음부터 이 사용자로 떠서 root 를 거치지 않는다.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # 노드가 죽으면 기본값(5분)을 기다리지 않고 30초 뒤 다른 노드에서 다시 뜬다
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # 가능하면 redis 와 다른 노드에 둔다. 한 대가 죽었을 때 데이터와 로그인을 한꺼번에 잃지 않기 위해서다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: redis
      containers:
        - name: mysql
          image: ghcr.io/9mkpark9/vet-db
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: root-password
            # 초기화 도구(vet-provision)가 이 값으로 서비스 계정 3개를 만든다
            - name: VET_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: auth-password
            - name: VET_CLINIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: clinic-password
            - name: VET_RESERVATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: reservation-password
          # 초기화 중에는 TCP 를 열지 않는다. 서비스 계정으로 TCP 접속해 시드가 읽히면 준비가 끝난 것이다.
          startupProbe:
            exec:
              command: ["vet-sql", "clinic", "SELECT 1 FROM vets LIMIT 1"]
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["vet-sql", "clinic", "SELECT 1 FROM vets LIMIT 1"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            failureThreshold: 3
          # 측정(docker stats): 데이터를 디스크에 둘 때 190MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        # Pod 와 수명이 같은 빈 폴더. PVC 가 아니다.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

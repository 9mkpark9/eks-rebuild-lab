# mysql: 클러스터 안에서 도는 예약 DB
# Deployment 가 아니라 StatefulSet 으로 띄운다. Pod 를 지웠을 때 Deployment 는 옛 Pod 가 내려가는 중에 새 Pod 를 바로 띄워서
# 두 MySQL 이 잠깐 같은 데이터 폴더를 잡는다. StatefulSet 은 옛 Pod(mysql-0)가 완전히 끝난 뒤에 같은 이름으로 다시 띄운다.
# 데이터는 볼륨(PVC mysql-data)에 둔다. Pod 를 지우거나 교체해도 데이터가 남는다.
#  - 처음 뜰 때(볼륨이 비어 있을 때)만 스키마, 그날 기준 시드, 서비스별 스키마·계정·뷰를 만든다.
#  - 다시 뜰 때는 볼륨에 있는 데이터를 그대로 쓴다. 초기화는 다시 돌지 않는다.
#  - 볼륨의 종류는 환경이 정한다. overlay 가 PVC 의 storageClassName 을 붙인다
#    (kubeadm 은 노드의 디스크, EKS 는 EBS).
#  - 서비스 계정의 비밀번호도 처음 뜰 때 Secret 의 값으로 정해진다. Secret 을 새로 만들었다면 볼륨도 새로 만들어야 맞는다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  labels:
    app: mysql
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  # DB 는 둘이 동시에 뜨면 안 된다. StatefulSet 은 같은 번호의 Pod 를 한 번에 하나만 둔다.
  replicas: 1
  # StatefulSet 이 짝으로 요구하는 Service 의 이름 (아래의 mysql Service)
  serviceName: mysql
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        # 공식 이미지의 mysql 사용자. 처음부터 이 사용자로 떠서 root 를 거치지 않는다.
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        # 볼륨의 소유 그룹을 이 번호로 맞춰 mysql 사용자가 쓸 수 있게 한다
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      # 노드가 죽으면 기본값(5분)을 기다리지 않고 30초 뒤 Pod 를 내보낸다.
      # 볼륨이 다른 노드로 따라갈 수 있을 때(EBS, 같은 가용 영역)만 다른 노드에서 다시 뜬다.
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 30
      # 가능하면 redis 와 다른 노드에 둔다. 한 대가 죽었을 때 데이터와 로그인을 한꺼번에 잃지 않기 위해서다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: redis
      containers:
        - name: mysql
          image: vet-db
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: root-password
            # 초기화 도구(vet-provision)가 이 값으로 서비스 계정 3개를 만든다
            - name: VET_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: auth-password
            - name: VET_CLINIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: clinic-password
            - name: VET_RESERVATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: reservation-password
          # 초기화 중에는 TCP 를 열지 않는다. 서비스 계정으로 TCP 접속해 시드가 읽히면 준비가 끝난 것이다.
          startupProbe:
            exec:
              command: ["vet-sql", "clinic", "SELECT 1 FROM vets LIMIT 1"]
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["vet-sql", "clinic", "SELECT 1 FROM vets LIMIT 1"]
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: mysql
            periodSeconds: 20
            failureThreshold: 3
          # 측정(docker stats): 데이터를 디스크에 둘 때 190MiB
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              # 볼륨의 맨 위가 아니라 그 안의 폴더를 쓴다. EBS 처럼 새로 포맷한 디스크에는 lost+found 폴더가 있어서,
              # 맨 위를 그대로 쓰면 MySQL 이 "데이터 폴더가 비어 있지 않다"며 초기화를 거부한다.
              subPath: mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  # 클러스터 안에서만 보인다(ClusterIP). 밖에서는 DB 에 접속할 수 없다.
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql

# clinic: 반려동물, 공지, 예약 가능 시간, 슬롯 자동 생성 (/api/pets, /api/notices, /api/slots, /api/admin/notices, /api/status/clinic)
# 세 서비스(auth, clinic, reservation)의 파일은 이름과 DB 스키마·계정만 다르다. 하나를 고치면 나머지 둘도 같이 고친다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clinic
  labels:
    app: clinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clinic
  # 새 Pod 가 준비된 뒤에 옛 Pod 를 내린다. 복제본이 1개여도 배포 중에 끊기지 않는다.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: clinic
    spec:
      # 종료 순서: preStop 5초(그 사이 Service 에서 빠진다) → SIGTERM → 스프링이 처리 중인 요청을 마침(최대 30초)
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clinic
          image: ghcr.io/9mkpark9/vet-clinic
          ports:
            - name: http
              containerPort: 8080
          env:
            # DB 주소. 클러스터 안의 MySQL 이면 Service 이름, 바깥 DB(RDS)이면 Secret 에서 받는다(components/db-external).
            - name: DB_HOST
              value: mysql
            # 서비스마다 자기 스키마에 자기 계정으로 접속한다
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://$(DB_HOST):3306/vet_clinic?connectionTimeZone=LOCAL&characterEncoding=UTF-8
            - name: SPRING_DATASOURCE_USERNAME
              value: vet_clinic
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-db
                  key: clinic-password
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vet-redis
                  key: password
            # 클러스터 안의 Redis 는 TLS 없이 쓴다
            - name: REDIS_TLS
              value: "false"
            # 서비스 3개 x 복제본 수 x 이 값 이 MySQL 의 max_connections(151)보다 작아야 한다
            - name: DB_POOL_MAX
              value: "5"
          # /health 는 DB 를 보지 않는다. DB 가 늦게 떠도 Pod 는 준비되고, 그동안 API 는 503 JSON 을 돌려준다.
          # JVM 이 뜨는 동안에는 startupProbe 만 본다 (최대 2초 x 60번 = 120초).
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          # 측정(docker stats): 메모리 170~227MiB, 평소 CPU 0.07~0.17코어, 뜰 때 CPU 10초.
          # 힙은 메모리 한도의 50%(256MB)다. CPU 한도는 뜨는 시간을 위해 넉넉히 둔다.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # 루트 파일 시스템이 읽기 전용이라 톰캣의 작업 폴더만 따로 준다
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: clinic
  labels:
    app: clinic
spec:
  selector:
    app: clinic
  ports:
    - name: http
      port: 8080
      targetPort: http

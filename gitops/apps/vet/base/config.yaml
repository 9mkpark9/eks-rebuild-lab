# 설정: 비밀이 아닌 값. 서비스 3개(auth, clinic, reservation)가 envFrom 으로 통째로 읽는다.
# 키 이름이 곧 컨테이너의 환경 변수 이름이다.
# 비밀번호는 여기에 두지 않는다. Secret(vet-db, vet-redis)에서 따로 받는다.
# 값을 바꾼 뒤에는 Pod 가 다시 떠야 반영된다: kubectl -n vet rollout restart deployment auth clinic reservation
apiVersion: v1
kind: ConfigMap
metadata:
  name: vet-config
data:
  # DB 주소. 클러스터 안의 MySQL 이면 Service 이름이다. 바깥 DB(RDS)를 쓰면 Secret 의 값이 이 값을 덮어쓴다(components/db-external).
  DB_HOST: mysql
  # 서비스 하나가 DB 에 여는 연결 수. Pod 수(서비스 3개 x 복제본 2개) x 이 값 = 30 이 MySQL 의 max_connections(151)보다 작아야 한다.
  DB_POOL_MAX: "5"
  # 로그인 세션 저장소(Redis)의 Service 이름
  SPRING_DATA_REDIS_HOST: redis
  # 클러스터 안의 Redis 는 TLS 없이 쓴다
  REDIS_TLS: "false"

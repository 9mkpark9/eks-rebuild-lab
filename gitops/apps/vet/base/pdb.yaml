# 배포나 노드 정비(drain)로 Pod 를 내릴 때 최소 1개는 남긴다.
# web 과 서비스 3개 모두 복제본이 2개이므로, 하나를 내리는 것은 허용하고 둘을 한꺼번에 내리는 것은 막는다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: auth
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clinic
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: clinic
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: reservation
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: reservation

# EKS(Auto Mode)에 한 번 준비하는 것: EBS 볼륨을 만들어 주는 StorageClass
# Auto Mode 는 StorageClass 를 만들어 두지 않는다. 없으면 MySQL 의 PVC 가 Pending 에 머문다.
#   kubectl apply -f gitops/cluster/eks/
# 형식은 AWS 문서 "Create a storage class"(EKS Auto Mode)를 따랐다.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vet-ebs
# Auto Mode 에 들어 있는 EBS 드라이버. 직접 설치하는 드라이버(ebs.csi.aws.com)와 이름이 다르다.
provisioner: ebs.csi.eks.amazonaws.com
# Pod 가 놓일 노드(가용 영역)가 정해진 뒤에 그 영역에 볼륨을 만든다. EBS 는 한 영역 안에서만 붙일 수 있다.
volumeBindingMode: WaitForFirstConsumer
# PVC 를 지우면 EBS 볼륨도 지운다. 남겨 두면 요금이 계속 나간다.
reclaimPolicy: Delete
allowedTopologies:
  - matchLabelExpressions:
      - key: eks.amazonaws.com/compute-type
        values:
          - auto
parameters:
  type: gp3
  encrypted: "true"

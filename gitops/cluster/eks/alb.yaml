# EKS(Auto Mode)에 한 번 준비하는 것: Ingress 를 ALB 로 만들어 주는 IngressClass
# Auto Mode 에는 로드밸런서 컨트롤러가 들어 있다. 이 두 자원으로 "어떤 ALB 를 만들지"를 알려 준다.
#   kubectl apply -f gitops/cluster/eks/
# 형식은 AWS 문서 "Create an IngressClass to configure an Application Load Balancer"(EKS Auto Mode)를 따랐다.
# 공개 서브넷에 kubernetes.io/role/elb=1 태그가 있어야 ALB 가 만들어진다.
apiVersion: eks.amazonaws.com/v1
kind: IngressClassParams
metadata:
  name: vet-alb
spec:
  # 인터넷에서 접속할 수 있는 ALB (기본값은 VPC 안에서만 보이는 internal)
  scheme: internet-facing
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: vet-alb
spec:
  # Auto Mode 의 로드밸런서 기능이 이 클래스를 맡는다
  controller: eks.amazonaws.com/alb
  parameters:
    apiGroup: eks.amazonaws.com
    kind: IngressClassParams
    name: vet-alb

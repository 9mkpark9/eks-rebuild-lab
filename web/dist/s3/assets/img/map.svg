    <path d="M186 0v300"/>
  </g>
  <text x="28" y="137" font-size="12" font-weight="700" fill="#8a97a3" font-family="sans-serif">보듬로</text>
  <text x="192" y="290" font-size="12" font-weight="700" fill="#8a97a3" font-family="sans-serif" transform="rotate(-90 192 290)">가상대로</text>
  <!-- 지하철역 -->
  <g>
    <circle cx="186" cy="132" r="15" fill="#2f6fd6"/>
    <path d="M180 126h12v9h-12zM182 139l-2 3M190 139l2 3" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="98" y="160" width="76" height="24" rx="12" fill="#2f6fd6"/>
    <text x="136" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="sans-serif">보듬역 2번</text>
  </g>
  <!-- 도보 경로 -->
  <path d="M202 132h146" stroke="#ff7a2f" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 10" fill="none"/>
  <!-- 병원 위치 -->
  <circle cx="362" cy="118" r="30" fill="#0f7a64" opacity=".14"/>
  <path d="M362 124s-20-17-20-33a20 20 0 0 1 40 0c0 16-20 33-20 33z" fill="#0f7a64"/>
  <circle cx="362" cy="91" r="9" fill="#fff"/>
  <path d="M359.8 86.6h4.4v2.2h2.2v4.4h-2.2v2.2h-4.4v-2.2h-2.2v-4.4h2.2z" fill="#ff7a2f"/>
  <rect x="300" y="160" width="124" height="30" rx="15" fill="#17263a"/>
  <text x="362" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">보듬 동물병원</text>
  <!-- 주차 -->
  <rect x="330" y="200" width="22" height="22" rx="6" fill="#4b5a66"/>
  <text x="341" y="216" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" font-family="sans-serif">P</text>

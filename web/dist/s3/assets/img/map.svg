<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" role="img" aria-labelledby="t">
  <title id="t">보듬 동물병원 약도 — 보듬역 2번 출구에서 보듬로를 따라 도보 4분</title>
  <rect width="600" height="360" fill="#eef3f1"/>
  <!-- 공원·하천 -->
  <rect x="24" y="22" width="150" height="96" rx="18" fill="#d5ebdc"/>
  <rect x="430" y="232" width="150" height="108" rx="18" fill="#d5ebdc"/>
  <path d="M0 300c90-30 160 10 250-14s150-56 350-20v94H0z" fill="#d3e6f5"/>
  <!-- 블록 -->
  <g fill="#fff" opacity=".9">
    <rect x="200" y="22" width="96" height="74" rx="10"/>
    <rect x="320" y="22" width="120" height="74" rx="10"/>
    <rect x="466" y="22" width="110" height="74" rx="10"/>
    <rect x="24" y="148" width="150" height="70" rx="10"/>
    <rect x="320" y="148" width="86" height="70" rx="10"/>
    <rect x="430" y="148" width="146" height="58" rx="10"/>
  </g>
  <!-- 도로 -->
  <g stroke="#ffffff" stroke-linecap="round" fill="none">
    <path d="M0 132h600" stroke-width="22"/>
    <path d="M186 0v300" stroke-width="18"/>
    <path d="M418 0v232" stroke-width="14"/>
  </g>
  <g stroke="#dbe4e0" stroke-linecap="round" fill="none" stroke-width="1.5" stroke-dasharray="8 8">
